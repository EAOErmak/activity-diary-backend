server.port=18080
server.address=127.0.0.1

spring.application.name=Diary Desktop Application

app.desktop.db.path=${APP_DB_PATH:${user.home}/.activity-diary/activity-diary.db}

spring.datasource.url=jdbc:sqlite:${app.desktop.db.path}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.jpa.database-platform=com.example.activity_diary.platform.desktop.persistence.DesktopSQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.contexts=desktop

app.base-url=http://127.0.0.1:18080

app.admin.database.clear.enabled=true

app.cors.allowed-origin=*
