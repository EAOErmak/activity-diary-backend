# Load local environment files without requiring IDE-specific env setup.
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]

# DB (Neon)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Batch fetching ??? LAZY ????????? (????????? N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# (???????????) batch ??? insert/update
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.liquibase.contexts=web

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION}

# Admin safety
app.admin.database.clear.enabled=${APP_ADMIN_DATABASE_CLEAR_ENABLED:false}

# Servers
server.port=8080
server.address=0.0.0.0
spring.application.name=Diary Application
